# =========================
# Site identity
# =========================
title: "Venali's Blog"
description: "Blog"
url: "https://venali.github.io"   # IMPORTANT: no trailing slash
baseurl: ""                      # keep empty for user/organization pages

# Used by atom.xml + footer/SEO
name: "Venali Sonone"
email: "venalisono@gmail.com"

# Optional profile fields
position: "Manager, Data Analytics"
company_name: "American Express"
place_name: "Tokyo, Mumbai, California, Berlin"
linkedin_profile: "https://jp.linkedin.com/in/venalisono"

# Long bio shown on homepage hero
long_description: >-
  About Venali Sonone
  Venali Sonone is a global Data & AI leader with over a decade of experience building high‑impact analytics,
  machine learning, and generative AI solutions across industries. With a strong track record leading data science
  teams in organizations such as American Express, Takeda, Philip Morris International, and Rakuten, Venali
  specializes in advanced analytics, predictive modeling, and scalable AI architectures that deliver measurable
  business value.

  Her work spans commercial analytics, risk modeling, portfolio theory, digital transformation, NLP, and large‑scale
  machine learning—supported by expertise across TensorFlow, PyTorch, LLMs, cloud platforms (GCP, AWS, Azure),
  and modern data engineering frameworks.

  As a multilingual professional fluent in English, German, and Japanese, Venali brings a uniquely international lens
  to business, technology, and communication. This blog reflects her current passions and long‑term mission:
  bridging advanced German learning, Generative AI, and Asset Management through the lens of emerging AI leadership.

# =========================
# Social / links
# =========================
github_url: "https://github.com/venali"
linkedin_url: "https://jp.linkedin.com/in/venalisono"
social:
  links:
    - "https://jp.linkedin.com/in/venalisono"
    - "https://github.com/venali"

# =========================
# Assets
# =========================
logo: "assets/img/headshot.svg"
cv_url: "assets/files/cv.pdf"
resume_url: "assets/files/resume.pdf"

# =========================
# Theme (unifies style across pages)
# =========================
color_mode: "auto"   # auto | light | dark

theme:
  hero_chip: "⚡ Tech Portfolio • Writing • Projects"
  cover_fallback: "/assets/images/cover-default.jpg"

  # Light mode colors (hex WITHOUT #)
  colors:
    background0: "f7fafc"
    background1: "eef2ff"
    card: "ffffff"
    text: "1f2937"
    muted: "4b5563"
    line: "e5e7eb"
    accent: "459c48"
    accent2: "7c3aed"
    accent3: "059669"

  # Dark mode colors (hex WITHOUT #)
  colors_dark:
    background0: "060913"
    background1: "0a1024"
    card: "0b1331"
    text: "e9eefc"
    muted: "aab3c5"
    line: "2a355a"
    accent: "6ae4ff"
    accent2: "a78bfa"
    accent3: "34d399"

# =========================
# Blog settings
# =========================
markdown: kramdown
highlighter: rouge
markdown: kramdown
kramdown:
  math_engine: mathjax
plugins:
  - jekyll-seo-tag

# Ensure posts always have a cover fallback (even if img_url missing)
defaults:
  - scope:
      path: ""
      type: posts
    values:
      img_url: "/assets/images/cover-default.jpg"

# =========================
# Feed (your atom.xml template uses these)
# =========================
feed:
  path: "/atom.xml"
  limit: 20
  icon: "/assets/img/headshot.svg"
  logo: "/assets/img/headshot.svg"
